{% extends "base.html" %}
{% block title %}マイプレイリスト - 仙人Tube{% endblock %}
{% block extra_css %}
<style>
  .mpl-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .mpl-section { margin-bottom: 32px; }
  .mpl-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .mpl-head h2 { margin: 0; font-size: 1.3rem; }
  .mpl-btn { padding: 6px 14px; border-radius: 18px; border: 1px solid var(--yt-border-color); background: var(--yt-hover-bg); color: inherit; cursor: pointer; text-decoration: none; font-size: .9rem; }
  .mpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .mpl-card { position: relative; color: inherit; text-decoration: none; }
  .mpl-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; display: block; background: #000; }
  .mpl-card .t { font-size: .9rem; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mpl-card .a { font-size: .8rem; opacity: .7; }
  .mpl-del { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.7); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; }
  .mpl-empty { opacity: .7; padding: 32px 0; text-align: center; }
</style>
{% endblock %}
{% block content %}
<div class="mpl-wrap">
  <h1>マイプレイリスト</h1>
  <p style="opacity:.7;">動画ページの「プレイリスト」ボタンから追加できます（このブラウザに保存されます）。</p>
  <div id="mpl-root"></div>
</div>
<script>
  const MPL_KEY = 'sennin_my_playlists';
  const load = () => { try { return JSON.parse(localStorage.getItem(MPL_KEY)) || {}; } catch (e) { return {}; } };
  const save = d => localStorage.setItem(MPL_KEY, JSON.stringify(d));
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render() {
    const d = load(), root = document.getElementById('mpl-root');
    const names = Object.keys(d);
    if (!names.length) { root.innerHTML = '<div class="mpl-empty">プレイリストはまだありません</div>'; return; }
    root.innerHTML = names.map(n => {
      const items = d[n];
      const play = items.length ? `<a class="mpl-btn" href="/watch?v=${items[0].id}&mpl=${encodeURIComponent(n)}&idx=0">▶ すべて再生</a>` : '';
      return `<div class="mpl-section"><div class="mpl-head"><h2>${esc(n)}</h2><span style="opacity:.7">${items.length} 本</span>${play}
        <button class="mpl-btn" onclick="renamePl(${esc(JSON.stringify(n))})">名前変更</button>
        <button class="mpl-btn" onclick="deletePl(${esc(JSON.stringify(n))})">削除</button></div>
        <div class="mpl-grid">${items.map((v, i) => `<div class="mpl-card">
          <a href="/watch?v=${v.id}&mpl=${encodeURIComponent(n)}&idx=${i}" style="color:inherit;text-decoration:none;">
          <img src="/thumbnail?v=${v.id}" loading="lazy" alt=""><div class="t">${esc(v.title || v.id)}</div><div class="a">${esc(v.author)}</div></a>
          <button class="mpl-del" title="削除" onclick="removeItem(${esc(JSON.stringify(n))},${i})">✕</button></div>`).join('')}</div></div>`;
    }).join('');
  }
  function deletePl(n) { if (!confirm(`「${n}」を削除しますか？`)) return; const d = load(); delete d[n]; save(d); render(); }
  function renamePl(n) { const m = prompt('新しい名前', n); if (!m || m === n) return; const d = load(); d[m] = d[n]; delete d[n]; save(d); render(); }
  function removeItem(n, i) { const d = load(); d[n].splice(i, 1); save(d); render(); }
  render();
</script>
{% endblock %}
